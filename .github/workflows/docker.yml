name: Build Synology Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Git tag to publish (latest or an existing v* tag)
        required: true
        default: latest
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.architecture }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Validate manually selected tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ "${REQUESTED_TAG}" == "latest" ]]; then
            exit 0
          fi

          if [[ "${REQUESTED_TAG}" != v* ]] || ! git for-each-ref \
            --format='%(refname:short)' refs/tags | grep -Fx -- "${REQUESTED_TAG}" > /dev/null; then
            echo "Invalid image tag: ${REQUESTED_TAG}" >&2
            echo "Choose 'latest' or an existing Git tag starting with 'v'." >&2
            exit 1
          fi

      - name: Determine image tags
        id: image_tags
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            release_tag="${{ github.event.release.tag_name }}"
            latest_tag=$(git tag --list 'v*' | sort -V | tail -n 1)
          else
            release_tag="${REQUESTED_TAG}"
            latest_tag=""
          fi

          image_name="${{ env.REGISTRY }}/${{ github.repository_owner }}/multiplayer-server-${{ matrix.architecture }}"
          {
            echo "tags<<EOF"
            echo "${image_name}:${release_tag}"
            if [[ -n "${latest_tag}" && "${release_tag}" == "${latest_tag}" ]]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.image_tags.outputs.tags }}

name: PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      - name: Publish package
        run: uv publish

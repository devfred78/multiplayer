name: Build Synology-Compatible Docker Image

on:
  workflow_dispatch:
    inputs:
      port:
        description: 'Game server listening port'
        required: true
        default: '65432'
      server_name:
        description: 'Name of the game server'
        required: false
        default: 'Multiplayer Server'
      enable_logging:
        description: 'Enable sending logs to a centralized server'
        type: boolean
        default: false
      enable_tls:
        description: 'Enable TLS encryption (generates a self-signed certificate)'
        type: boolean
        default: false
      tls_domain:
        description: 'Domain name for TLS (if enabled, default is localhost)'
        required: false
        default: 'localhost'
      persistence:
        description: 'Type of persistence for players and games'
        type: choice
        options:
          - none
          - json
          - sqlite
        default: none
      persistence_path:
        description: 'Path to the persistence file (e.g., /data/server_data.json)'
        required: false
        default: ''
      logging_host:
        description: 'Log server address (if enabled)'
        required: false
      logging_port:
        description: 'Log server port (if enabled)'
        required: false
        default: '5000'
      image_tag:
        description: 'Version tag to build'
        type: choice
        options:
          - v1.0.0
          - v0.11.0
          - v0.10.1
          - v0.10.0
          - v0.9.3
          - v0.9.2
          - v0.9.1
          - v0.9.0
          - v0.8.0
          - v0.7.0
          - v0.6.0
          - v0.5.5
          - v0.5.4
          - v0.5.3
          - v0.5.2
          - v0.5.1
          - v0.5.0
        default: v1.0.0
      push_latest:
        description: 'Also tag as latest'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: determine_tag
        run: |
          echo "TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "Using selected tag: ${{ github.event.inputs.image_tag }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multiplayer-server-synology
          tags: |
            type=raw,value=${{ steps.determine_tag.outputs.TAG }}
            type=raw,value=latest,enable=${{ github.event.inputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.description=Synology-compatible game server for the multiplayer library. See PACKAGE.md on GitHub for detailed setup and usage.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/PACKAGE.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify build and Show Run Command
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/multiplayer-server-synology:${{ steps.determine_tag.outputs.TAG }}"
          echo "Multi-arch image build and push completed."
          echo "Image: $IMAGE"
          
          CMD="docker run -d -p ${{ github.event.inputs.port }}:${{ github.event.inputs.port }} $IMAGE --port ${{ github.event.inputs.port }}"
          
          if [ "${{ github.event.inputs.server_name }}" != "" ]; then
            CMD="$CMD --name \"${{ github.event.inputs.server_name }}\""
          fi
          
          if [ "${{ github.event.inputs.enable_logging }}" = "true" ]; then
            CMD="$CMD --logging-host ${{ github.event.inputs.logging_host }} --logging-port ${{ github.event.inputs.logging_port }}"
          fi
          
          if [ "${{ github.event.inputs.enable_tls }}" = "true" ]; then
            CMD="$CMD --tls-self-signed --tls-domain ${{ github.event.inputs.tls_domain }}"
          fi
          
          if [ "${{ github.event.inputs.persistence }}" != "none" ]; then
            CMD="$CMD --persistence ${{ github.event.inputs.persistence }}"
            if [ "${{ github.event.inputs.persistence_path }}" != "" ]; then
              CMD="$CMD --persistence-path ${{ github.event.inputs.persistence_path }}"
            fi
          fi
          
          echo "To run the server on your Synology NAS, pull the image and use:"
          echo "$CMD"

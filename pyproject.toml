[project]
name = "multiplayer"
version = "2.0.1"
description = "Library that allows you to manage multiple players, locally, on a network, or on the Internet."
readme = "README.md"
authors = [
    { name = "devfred78", email = "devfred78@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "msgpack>=1.2.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.mypy]
exclude = '^private-doc/'
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment", "misc", "operator", "union-attr"]

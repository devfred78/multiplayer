[project]
name = "multiplayer"
version = "2.0.0"
description = "Library that allows you to manage multiple players, locally, on a network, or on the Internet."
readme = "README.md"
authors = [
    { name = "devfred78", email = "devfred78@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
